<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRSTY Launch Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #e2c97a;
  --gold-dim: rgba(201,168,76,0.13);
  --black: #0D0D0D;
  --dark: #161616;
  --panel: #1c1c1c;
  --panel2: #222;
  --border: #2a2a2a;
  --text: #f0f0f0;
  --muted: #555;
  --muted2: #888;
  --done-color: #3a9e62;
  --done-bg: rgba(58,158,98,0.13);
  --ip-bg: rgba(201,168,76,0.13);
  --ns-bg: rgba(60,60,60,0.2);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

header{background:var(--dark);border-bottom:2px solid var(--gold);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:200;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:.12em;color:var(--gold);}
.logo-sub{font-size:.68rem;color:var(--muted2);letter-spacing:.09em;text-transform:uppercase;margin-top:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.gp{font-size:.78rem;color:var(--muted2);margin-right:6px;}
.gp span{color:var(--gold);font-weight:600;}
.btn{background:var(--gold);color:var(--black);border:none;padding:7px 16px;font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:.08em;cursor:pointer;border-radius:2px;transition:background .18s;}
.btn:hover{background:var(--gold-light);}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--muted2);padding:6px 13px;font-size:.74rem;cursor:pointer;border-radius:2px;transition:all .18s;font-family:'DM Sans',sans-serif;}
.btn-g:hover{border-color:var(--gold);color:var(--gold);}

.main{max-width:1320px;margin:0 auto;padding:22px 18px 80px;}
.wbar{display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.wlbl{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--gold);letter-spacing:.1em;margin-right:4px;}
.wbtn{background:var(--panel);border:1px solid var(--border);color:var(--muted2);padding:4px 11px;font-size:.7rem;cursor:pointer;border-radius:2px;transition:all .14s;font-family:'DM Sans',sans-serif;}
.wbtn:hover{border-color:var(--gold);color:var(--text);}
.wbtn.active{background:var(--gold);color:var(--black);border-color:var(--gold);font-weight:600;}
.legend{display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap;font-size:.7rem;color:var(--muted2);}
.li{display:flex;align-items:center;gap:5px;}
.ld{width:10px;height:10px;border-radius:2px;}
.hint{margin-left:auto;font-size:.67rem;color:var(--muted);font-style:italic;}

/* SECTION */
.section{margin-bottom:20px;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.sh{background:var(--panel);padding:12px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);}
.sh:hover{background:#202020;}
.sn{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:var(--gold);min-width:26px;}
.st{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.1em;flex:1;}
.ss{font-size:.7rem;color:var(--muted2);margin-right:6px;}
.ss .sc{color:var(--done-color);}
.chev{color:var(--muted);font-size:.75rem;transition:transform .2s;}
.section.collapsed .chev{transform:rotate(-90deg);}
.section.collapsed .sb{display:none;}
.sbar{height:3px;background:var(--border);}
.sbar-f{height:100%;background:var(--gold);transition:width .35s;}

/* TABLE */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead tr{background:#131313;}
th{padding:9px 8px;font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
th.wk{text-align:center;min-width:32px;padding:9px 2px;}
th.wk.cur{color:var(--gold);}
td{padding:0;border-bottom:1px solid #1d1d1d;vertical-align:middle;}

/* ROWS */
.tr{transition:background .12s;}
.tr:hover{background:rgba(255,255,255,0.018);}
.tr.sub{background:rgba(0,0,0,0.22);}
.tr.sub:hover{background:rgba(255,255,255,0.013);}
.tr:last-child td{border-bottom:none;}

.ck{padding:10px 6px 10px 16px;width:32px;}
.sub .ck{padding-left:36px;}
.box{width:14px;height:14px;border:1px solid var(--muted);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;flex-shrink:0;}
.box:hover{border-color:var(--gold);}
.box.on{background:var(--done-color);border-color:var(--done-color);}
.box.on::after{content:'✓';color:#fff;font-size:8px;}

.ex{width:20px;padding:0 2px;}
.eb{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.68rem;padding:3px;line-height:1;transition:transform .18s,color .18s;}
.eb:hover{color:var(--gold);}
.eb.open{transform:rotate(90deg);}

.nc{padding:10px 10px 10px 3px;min-width:155px;}
.tn{font-size:.82rem;color:var(--text);cursor:text;border-radius:2px;padding:2px 4px;display:inline-block;}
.tn:hover{background:rgba(255,255,255,0.04);}
.tn[contenteditable="true"]{background:var(--gold-dim);outline:1px solid var(--gold);}
.tn.dn{text-decoration:line-through;color:var(--muted);}
.sublbl{font-size:.62rem;color:var(--muted);margin-right:3px;font-style:italic;}

.stc{padding:10px 7px;width:105px;}
.pill{font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;cursor:pointer;user-select:none;white-space:nowrap;display:inline-block;transition:all .14s;}
.pill.not-started{background:var(--ns-bg);color:var(--muted2);border:1px solid #333;}
.pill.in-progress{background:var(--ip-bg);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
.pill.done{background:var(--done-bg);color:var(--done-color);border:1px solid rgba(58,158,98,.35);}

.pc{padding:10px 7px;width:68px;}
.pri{font-size:.57rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:10px;cursor:pointer;user-select:none;}
.pri.high{background:rgba(192,57,43,.18);color:#e05a4a;border:1px solid rgba(224,90,74,.3);}
.pri.med{background:var(--ip-bg);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
.pri.low{background:var(--ns-bg);color:#555;border:1px solid #333;}

.oc{padding:10px 7px;width:78px;}
.oi{background:transparent;border:none;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:.72rem;width:68px;padding:2px 4px;border-radius:2px;}
.oi:focus{outline:1px solid var(--gold);background:var(--gold-dim);color:var(--text);}

.ntc{padding:10px 7px;width:40px;text-align:center;}
.nb{background:none;border:none;cursor:pointer;font-size:.9rem;color:var(--muted);transition:color .15s;padding:3px 5px;border-radius:2px;}
.nb:hover{color:var(--gold);}
.nb.has{color:var(--gold);}

.wc{padding:6px 2px;text-align:center;width:32px;}
.wc.cur{background:rgba(201,168,76,.04);}
.gb{width:24px;height:17px;border-radius:2px;cursor:pointer;margin:0 auto;transition:all .13s;}
.gb.on{background:var(--gold);}
.gb.on.db{background:var(--done-color);}
.gb:hover{opacity:.6;transform:scaleY(1.1);}
.sub .gb{height:12px;width:20px;}

.dc{padding:0 5px 0 2px;width:20px;opacity:0;transition:opacity .14s;}
.tr:hover .dc{opacity:1;}
.db2{background:none;border:none;color:#444;cursor:pointer;font-size:.82rem;padding:2px 3px;transition:color .14s;}
.db2:hover{color:#c0392b;}

.addr td{padding:7px 14px;border-bottom:none;}
.addb{background:none;border:1px dashed var(--border);color:var(--muted);font-size:.72rem;padding:5px 11px;cursor:pointer;border-radius:2px;font-family:'DM Sans',sans-serif;transition:all .18s;display:inline-flex;align-items:center;gap:4px;}
.addb:hover{border-color:var(--gold);color:var(--gold);}
.adds{background:none;border:none;color:var(--muted);font-size:.67rem;padding:3px 8px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .15s;}
.adds:hover{color:var(--gold);}

/* NOTES PANEL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.open{opacity:1;pointer-events:all;}
.np{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:96vw;background:var(--panel2);border-left:2px solid var(--gold);z-index:301;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);}
.np.open{transform:translateX(0);}
.nph{padding:20px 20px 15px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;}
.nps{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin-bottom:3px;}
.npn{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;color:var(--gold);letter-spacing:.08em;line-height:1.1;}
.npcl{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:1.25rem;line-height:1;transition:color .15s;}
.npcl:hover{color:var(--text);}
.npb{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px;}
.nf label{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted2);margin-bottom:5px;}
.nta{width:100%;min-height:110px;background:#181818;border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.83rem;padding:9px 11px;border-radius:3px;resize:vertical;line-height:1.55;transition:border-color .15s;}
.nta:focus{outline:none;border-color:var(--gold);}
.nta::placeholder{color:var(--muted);}
.nii{width:100%;background:#181818;border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.82rem;padding:8px 11px;border-radius:3px;transition:border-color .15s;}
.nii:focus{outline:none;border-color:var(--gold);}
.nii::placeholder{color:var(--muted);}
.ndiv{border:none;border-top:1px solid var(--border);}
.nstl{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted2);margin-bottom:8px;}
.nsl{display:flex;flex-direction:column;gap:5px;}
.nsi{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#181818;border:1px solid var(--border);border-radius:3px;}
.nsc{width:13px;height:13px;border:1px solid var(--muted);border-radius:2px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .14s;}
.nsc:hover{border-color:var(--gold);}
.nsc.on{background:var(--done-color);border-color:var(--done-color);}
.nsc.on::after{content:'✓';color:#fff;font-size:7px;}
.nsn{flex:1;font-size:.79rem;color:var(--text);}
.nsn.dn{text-decoration:line-through;color:var(--muted);}
.nadd{display:flex;gap:7px;margin-top:8px;}
.nadd input{flex:1;background:#181818;border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.79rem;padding:7px 10px;border-radius:3px;}
.nadd input:focus{outline:none;border-color:var(--gold);}
.nadd button{background:var(--gold);color:var(--black);border:none;padding:7px 12px;cursor:pointer;border-radius:2px;font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:.06em;}
.nadd button:hover{background:var(--gold-light);}
.npsv{margin:0 20px 18px;flex-shrink:0;}
.npsv button{width:100%;background:var(--gold);color:var(--black);border:none;padding:11px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:.1em;cursor:pointer;border-radius:2px;transition:background .18s;}
.npsv button:hover{background:var(--gold-light);}
.nfl{text-align:center;font-size:.7rem;color:var(--done-color);margin-top:5px;height:15px;transition:opacity .3s;}

.tt{position:fixed;background:var(--panel);border:1px solid var(--gold);color:var(--text);font-size:.7rem;padding:5px 9px;border-radius:3px;pointer-events:none;z-index:9999;white-space:nowrap;display:none;}
@media print{header{position:static;}.dc,.addb,.adds,.btn,.btn-g,.nb,.np,.ov{display:none!important;}}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">VRSTY — Launch Timeline</div>
    <div class="logo-sub">Vrsty, Inc · Delaware C-Corp · Interactive Gantt Tracker</div>
  </div>
  <div class="hdr-right">
    <div class="gp" id="gp"></div>
    <button class="btn-g" onclick="expandAll()">Expand All</button>
    <button class="btn-g" onclick="collapseAll()">Collapse All</button>
    <button class="btn" onclick="window.print()">Print</button>
  </div>
</header>

<div class="main">
  <div class="legend">
    <div class="li"><div class="ld" style="background:var(--gold)"></div>In Progress</div>
    <div class="li"><div class="ld" style="background:var(--done-color)"></div>Done</div>
    <div class="li"><div class="ld" style="background:#2a2a2a;border:1px solid #3a3a3a"></div>Not Started</div>
    <div class="li">▶ expand subtasks &nbsp;|&nbsp; 📋 open notes &amp; details</div>
    <div class="hint">Click Gantt blocks to assign weeks · Click status/priority to cycle · Click name to rename</div>
  </div>
  <div class="wbar">
    <div class="wlbl">Weeks:</div>
    <button class="wbtn active" onclick="setW(12,this)">12</button>
    <button class="wbtn" onclick="setW(16,this)">16</button>
    <button class="wbtn" onclick="setW(20,this)">20</button>
    <button class="wbtn" onclick="setW(26,this)">26</button>
  </div>
  <div id="sc"></div>
</div>

<div class="ov" id="ov" onclick="closeN()"></div>
<div class="np" id="np">

  <div class="npb">

    <div class="nf"><label>Next Action / Blocker</label>

    <div class="nf"><label>Owner / Vendor / Contact</label>
      <input class="nii" id="npCt" type="text" placeholder="Who owns this or which vendor?"></div>
    <div class="nf"><label>Target Date / Deadline</label>
      <input class="nii" id="npDt" type="text" placeholder="e.g. Week 3 · May 15 · Spring launch"></div>
    <hr class="ndiv">
    <div>
      <div class="nstl">Subtasks</div>
      <div class="nsl" id="nsl"></div>
      <div class="nadd">
        <input id="nsi" type="text" placeholder="Add a subtask…" onkeydown="if(event.key==='Enter')addSubPanel()">
        <button onclick="addSubPanel()">Add</button>
      </div>
    </div>
  </div>
  <div class="npsv">
    <button onclick="saveN()">Save Notes</button>
    <div class="nfl" id="nfl" style="opacity:0"></div>
  </div>
</div>
<div class="tt" id="tt"></div>

  ]},
  {id:'s7',name:'Growth',num:'07',tasks:[
    {id:'t29',name:'Sr. Branch Managers',st:'not-started',pri:'med',own:'',wks:[],notes:{d:'',nx:'',ct:'',dt:''},subs:[]},
    {id:'t30',name:'District Managers (DMs)',st:'not-started',pri:'med',own:'',wks:[],notes:{d:'',nx:'',ct:'',dt:''},subs:[]},
  ]},
];

function fT(id){for(const s of D){const t=s.tasks.find(t=>t.id===id);if(t)return t;}return null;}
function fS(id){return D.find(s=>s.id===id);}
function fSforT(tid){return D.find(s=>s.tasks.find(t=>t.id===tid));}

function render(){
  const c=document.getElementById('sc');c.innerHTML='';
  D.forEach(s=>c.appendChild(bSec(s)));
  upGP();
}

function bSec(sec){
  const dn=sec.tasks.filter(t=>t.st==='done').length;
  const pct=sec.tasks.length?Math.round(dn/sec.tasks.length*100):0;
  const el=document.createElement('div');
  el.className='section';el.id=sec.id;
  const h=document.createElement('div');h.className='sh';
  h.innerHTML=`<span class="sn">${sec.num}</span><span class="st">${sec.name}</span>
    <span class="ss"><span class="sc">${dn}</span>/${sec.tasks.length} done · ${pct}%</span>
    <span class="chev">▾</span>`;
  h.onclick=()=>el.classList.toggle('collapsed');
  el.appendChild(h);
  const bar=document.createElement('div');bar.className='sbar';
  bar.innerHTML=`<div class="sbar-f" style="width:${pct}%"></div>`;
  el.appendChild(bar);
  const body=document.createElement('div');body.className='sb';
  const tw=document.createElement('div');tw.className='tw';
  const tbl=document.createElement('table');
  let th=`<thead><tr><th style="width:32px;padding-left:16px"></th><th style="width:20px"></th>
    <th>Task</th><th>Status</th><th>Pri</th><th>Owner</th><th style="width:38px;text-align:center">Notes</th>`;
  for(let w=1;w<=TW;w++) th+=`<th class="wk${w===CW?' cur':''}">${w}</th>`;
  th+=`<th style="width:20px"></th></tr></thead>`;
  tbl.innerHTML=th;
  const tb=document.createElement('tbody');
  sec.tasks.forEach(task=>{
    tb.appendChild(bRow(task,sec.id,sec.name));
    if(EX[task.id]&&task.subs.length){
      task.subs.forEach(sub=>tb.appendChild(bSubRow(sub,task,sec.id)));
      const asr=document.createElement('tr');asr.className='tr sub';
      asr.innerHTML=`<td colspan="${8+TW}" style="padding:4px 4px 4px 46px;">
        <button class="adds" onclick="addSubI('${task.id}','${sec.id}')">＋ add subtask</button></td>`;
      tb.appendChild(asr);
    }
  });
  const ar=document.createElement('tr');ar.className='addr';
  ar.innerHTML=`<td colspan="${8+TW}"><button class="addb" onclick="addT('${sec.id}')">＋ Add task</button></td>`;
  tb.appendChild(ar);
  tbl.appendChild(tb);tw.appendChild(tbl);body.appendChild(tw);el.appendChild(body);
  return el;
}

function bRow(t,sid,sname){
  const tr=document.createElement('tr');tr.className='tr';tr.id='r'+t.id;
  const isDn=t.st==='done';
  const hS=t.subs.length>0;
  const isEx=EX[t.id];
  const hN=t.notes.d||t.notes.nx||t.notes.ct||t.notes.dt;
  let h=`
    <td class="ck"><div class="box${isDn?' on':''}" onclick="togDn('${t.id}','${sid}')"></div></td>
    <td class="ex">${hS?`<button class="eb${isEx?' open':''}" onclick="togEx('${t.id}','${sid}')">▶</button>`:''}</td>
    <td class="nc"><span class="tn${isDn?' dn':''}" contenteditable="false"
      onclick="mkEd(this)" onblur="svNm(this,'${t.id}')" onkeydown="if(event.key==='Enter')this.blur()"
      >${t.name}</span></td>
    <td class="stc"><span class="pill ${t.st}" onclick="cycSt('${t.id}','${sid}')">${SL[t.st]}</span></td>
    <td class="pc"><span class="pri ${t.pri}" onclick="cycPri('${t.id}','${sid}')">${PL[t.pri]}</span></td>
    <td class="oc"><input class="oi" type="text" placeholder="Owner" value="${t.own}" onchange="setOwn('${t.id}',this.value)"></td>
    <td class="ntc"><button class="nb${hN?' has':''}" onclick="openN('${t.id}','${sname}')" title="Notes & details">📋</button></td>`;
  for(let w=1;w<=TW;w++){
    const on=t.wks.includes(w);
    h+=`<td class="wc${w===CW?' cur':''}"><div class="gb${on?' on':''}${on&&isDn?' db':''}"
      onclick="togW('${t.id}','${sid}',${w})"
      onmouseenter="showTT(event,'${t.name} — Wk ${w}')" onmouseleave="hideTT()"></div></td>`;
  }
  h+=`<td class="dc"><button class="db2" onclick="delT('${t.id}','${sid}')" title="Remove">✕</button></td>`;
  tr.innerHTML=h;return tr;
}

function bSubRow(sub,task,sid){
  const tr=document.createElement('tr');tr.className='tr sub';tr.id='sr'+sub.id;
  let h=`
    <td class="ck" style="padding-left:36px"><div class="box${sub.dn?' on':''}" onclick="togSD('${sub.id}','${task.id}','${sid}')"></div></td>
    <td class="ex"></td>
    <td class="nc"><span class="sublbl">↳</span><span class="tn${sub.dn?' dn':''}" contenteditable="false"
      onclick="mkEd(this)" onblur="svSNm(this,'${sub.id}','${task.id}')" onkeydown="if(event.key==='Enter')this.blur()"
      >${sub.name}</span></td>
    <td colspan="4" style="padding:0 8px;font-size:.65rem;color:var(--muted)">subtask</td>`;
  for(let w=1;w<=TW;w++) h+=`<td class="wc${w===CW?' cur':''}"></td>`;
  h+=`<td class="dc"><button class="db2" onclick="delSub('${sub.id}','${task.id}','${sid}')" title="Remove">✕</button></td>`;
  tr.innerHTML=h;return tr;
}

function ref(sid){
  const sec=fS(sid);const old=document.getElementById(sid);
  const isC=old.classList.contains('collapsed');
  const n=bSec(sec);if(isC)n.classList.add('collapsed');
  old.parentNode.replaceChild(n,old);upGP();
}

function togDn(tid,sid){const t=fT(tid);t.st=t.st==='done'?'not-started':'done';ref(sid);}
function cycSt(tid,sid){const t=fT(tid);t.st=STATS[(STATS.indexOf(t.st)+1)%STATS.length];ref(sid);}
function cycPri(tid,sid){const t=fT(tid);t.pri=PRIS[(PRIS.indexOf(t.pri)+1)%PRIS.length];ref(sid);}
function togW(tid,sid,w){const t=fT(tid);const i=t.wks.indexOf(w);if(i===-1)t.wks.push(w);else t.wks.splice(i,1);t.wks.sort((a,b)=>a-b);ref(sid);}
function setOwn(tid,v){const t=fT(tid);if(t)t.own=v;}
function togEx(tid,sid){EX[tid]=!EX[tid];ref(sid);}
function togSD(subId,tid,sid){const t=fT(tid);const s=t.subs.find(s=>s.id===subId);if(s)s.dn=!s.dn;ref(sid);if(activeT===tid)rnSL(t);}
function mkEd(el){el.contentEditable='true';el.focus();const r=document.createRange();r.selectNodeContents(el);window.getSelection().removeAllRanges();window.getSelection().addRange(r);}
function svNm(el,tid){el.contentEditable='false';const t=fT(tid);if(t)t.name=el.textContent.trim()||t.name;}
function svSNm(el,subId,tid){el.contentEditable='false';const t=fT(tid);const s=t&&t.subs.find(s=>s.id===subId);if(s)s.name=el.textContent.trim()||s.name;}
function addT(sid){const sec=fS(sid);sec.tasks.push({id:'t'+(TIC++),name:'New Task',st:'not-started',pri:'med',own:'',wks:[],notes:{d:'',nx:'',ct:'',dt:''},subs:[]});ref(sid);}
function delT(tid,sid){const sec=fS(sid);sec.tasks=sec.tasks.filter(t=>t.id!==tid);ref(sid);}
function delSub(subId,tid,sid){const t=fT(tid);t.subs=t.subs.filter(s=>s.id!==subId);ref(sid);if(activeT===tid)rnSL(t);}
function addSubI(tid,sid){const name=prompt('Subtask name:');if(!name)return;const t=fT(tid);t.subs.push({id:'u'+(TIC++),name:name.trim(),dn:false});EX[tid]=true;ref(sid);}
function expandAll(){document.querySelectorAll('.section').forEach(s=>s.classList.remove('collapsed'));}
function collapseAll(){document.querySelectorAll('.section').forEach(s=>s.classList.add('collapsed'));}
function setW(n,btn){TW=n;document.querySelectorAll('.wbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function upGP(){let tot=0,dn=0;D.forEach(s=>{tot+=s.tasks.length;dn+=s.tasks.filter(t=>t.st==='done').length;});const pct=tot?Math.round(dn/tot*100):0;document.getElementById('gp').innerHTML=`<span>${dn}</span>/${tot} tasks · <span>${pct}%</span>`;}
function showTT(e,txt){const t=document.getElementById('tt');t.textContent=txt;t.style.display='block';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY-26)+'px';}
function hideTT(){document.getElementById('tt').style.display='none';}

// NOTES PANEL
function openN(tid,sname){
  const t=fT(tid);activeT=tid;
  document.getElementById('npSec').textContent=sname;
  document.getElementById('npNm').textContent=t.name;
  document.getElementById('npD').value=t.notes.d||'';
  document.getElementById('npNx').value=t.notes.nx||'';
  document.getElementById('npCt').value=t.notes.ct||'';
  document.getElementById('npDt').value=t.notes.dt||'';
  rnSL(t);
  document.getElementById('np').classList.add('open');
  document.getElementById('ov').classList.add('open');
  document.getElementById('nfl').style.opacity='0';
}
function rnSL(t){
  const list=document.getElementById('nsl');list.innerHTML='';
  t.subs.forEach(sub=>{
    const div=document.createElement('div');div.className='nsi';
    div.innerHTML=`<div class="nsc${sub.dn?' on':''}" onclick="togSP('${sub.id}')"></div>
      <span class="nsn${sub.dn?' dn':''}" contenteditable="false"
        onclick="mkEd(this)" onblur="svSP(this,'${sub.id}')" onkeydown="if(event.key==='Enter')this.blur()"
      >${sub.name}</span>
      <button class="db2" style="opacity:.5;flex-shrink:0" onclick="delSP('${sub.id}')">✕</button>`;
    list.appendChild(div);
  });
}
function togSP(subId){
  const t=fT(activeT);const s=t.subs.find(s=>s.id===subId);if(s)s.dn=!s.dn;
  rnSL(t);const sec=fSforT(activeT);if(sec)ref(sec.id);
}
function svSP(el,subId){
  el.contentEditable='false';const t=fT(activeT);
  const s=t.subs.find(s=>s.id===subId);if(s)s.name=el.textContent.trim()||s.name;
}
function delSP(subId){
  const t=fT(activeT);t.subs=t.subs.filter(s=>s.id!==subId);rnSL(t);
  const sec=fSforT(activeT);if(sec)ref(sec.id);
}
function addSubPanel(){
  const inp=document.getElementById('nsi');const name=inp.value.trim();if(!name)return;
  const t=fT(activeT);t.subs.push({id:'u'+(TIC++),name,dn:false});
  EX[activeT]=true;rnSL(t);inp.value='';
  const sec=fSforT(activeT);if(sec)ref(sec.id);
}
function saveN(){
  const t=fT(activeT);if(!t)return;
  t.notes.d=document.getElementById('npD').value;
  t.notes.nx=document.getElementById('npNx').value;
  t.notes.ct=document.getElementById('npCt').value;
  t.notes.dt=document.getElementById('npDt').value;
  const sec=fSforT(activeT);if(sec)ref(sec.id);
  const fl=document.getElementById('nfl');fl.textContent='✓ Notes saved';fl.style.opacity='1';
  setTimeout(()=>fl.style.opacity='0',2200);
}
function closeN(){
  document.getElementById('np').classList.remove('open');
  document.getElementById('ov').classList.remove('open');
  activeT=null;
}

render();
</script>
</body>
</html>
